[package]
name = "slint_calculator"
version = "0.1.0"
edition = "2021"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"

[dependencies]
slint = "1.16"

[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "1.16", default-features = false, features = ["backend-android-activity-06", "renderer-femtovg"] }
i-slint-backend-android-activity = { version = "1.16", features = ["native-activity"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
slint = { version = "1.16", default-features = false, features = ["backend-winit-wasm", "renderer-femtovg"] }
wasm-bindgen = "0.2"

[build-dependencies]
slint-build = "1.16"

[[bin]]
name = "slint_calculator"
path = "src/main.rs"

[lib]
name = "slint_calculator"
crate-type = ["cdylib"]
path = "src/lib.rs"

[package.metadata.android]
package = "com.example.slint_calculator"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 23
target_sdk_version = 30

[package.metadata.android.signing.release]
path = "debug.keystore"
keystore_password = "android"