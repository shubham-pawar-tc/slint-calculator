[package]
name = "slint_calculator"
version = "0.1.0"
edition = "2021"

[dependencies]
slint = "1.16"

[build-dependencies]
slint-build = "1.16"

[[bin]]
name = "slint_calculator"
path = "src/main.rs"

[lib]
name = "slint_calculator"
crate-type = ["cdylib"]
path = "src/lib.rs"

[package.metadata.android]
package = "com.example.slint_calculator"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 23
target_sdk_version = 30